name: secure-supply-chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 Gitleaks (FAIL on real leaks)
      - name: Secrets scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🧠 Semgrep (FAIL on high severity)
      - name: SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

      # 🔍 Trivy FS scan (FAIL on CRITICAL/HIGH)
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      # 🏷️ Set image name (lowercase required for GHCR)
      - name: Set image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/ledger-api" >> $GITHUB_ENV
          echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      # 🐳 Setup Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🏗️ Build image
      - name: Build Docker image
        run: docker build -t $IMAGE:$TAG ./app

      # 🔍 Trivy Image scan (FAIL on CRITICAL/HIGH with fixes)
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      # 🔐 Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 📦 Push image
      - name: Push image
        run: docker push $IMAGE:$TAG

      # 🔍 Get image digest
      - name: Get image digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:$TAG | cut -d'@' -f2)
          echo "DIGEST=$DIGEST" >> $GITHUB_ENV

      # ✍️ Install Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # 🔏 Sign image (KEYLESS)
      - name: Sign image (Cosign keyless)
        run: cosign sign --yes $IMAGE@$DIGEST

      # 📜 Provenance (GitHub official attestation)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      # 🔄 Update GitOps manifest (digest-based = best practice)
      - name: Update GitOps manifest
        run: |
          sed -i "s|image:.*|image: ${IMAGE}@${DIGEST}|" gitops/apps/ledger-api.yaml
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/ledger-api.yaml
          git diff --staged --quiet || git commit -m "chore(gitops): deploy ${TAG}"
          git push
