name: secure-supply-chain

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ledger-api

jobs:
  build-secure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 Gitleaks (secrets)
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2

      # 🔍 Semgrep (SAST)
      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

      # 🛡️ Trivy FS scan
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 🏷️ Set tag
      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      # 🐳 Build image
      - name: Build Docker image
        run: docker build -t $IMAGE:$TAG ./app

      # 🔍 Trivy image scan
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      # 🔑 Login GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🚀 Push image
      - name: Push image
        run: docker push $IMAGE:$TAG

      # 🔏 Cosign signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:$TAG)
          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          cosign sign --yes $DIGEST

      # 🔄 Update GitOps manifest
      - name: Update GitOps manifest
        run: |
          sed -i "s|image:.*|image: ${IMAGE}:${TAG}|" gitops/apps/ledger-api.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gitops/apps/ledger-api.yaml
          git commit -m "deploy: update image to ${TAG}" || echo "No changes"
          git push
