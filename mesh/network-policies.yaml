apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: payments
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-reporting
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app: ledger-api
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: reporting
