apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting
  template:
    metadata:
      labels:
        app: reporting
    spec:
      containers:
        - name: reporting
          image: curlimages/curl
          command: ["sleep", "infinity"]
