          env:
            - name: STRIPE_API_KEY
              value: "sk_live_9f3a2b7c1e4d8REDACTED"
            - name: DB_PASSWORD
              value: "P@ssw0rd123"
          ports:
            - containerPort: 8080
          # Violates: runs as root — no securityContext /
          # no runAsNonRoot, no capability drop, no readOnlyRootFilesystem
